<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=localStorage.getItem('spadesToken'),user=JSON.parse(localStorage.getItem('spadesUser')||'null'),registerMode=false,users=[],projects=[],allTasks=[],activeProject=null,view='overview',boardMode='board',query='',dark=localStorage.getItem('spadesTheme')==='dark';
const statuses=[['todo','To do'],['doing','In progress'],['review','In review'],['done','Done']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=s=>String(s||'?').split(/\s+/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase();const dateNow=()=>new Date().toISOString().slice(0,10);const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No due date';const isLate=t=>t.due&&t.due<dateNow()&&t.status!=='done';
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3200)}
async function api(method,path,body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&token&&path!=='login'){logout(false)}throw Error(d.error||'Request failed')}return d}
const safe=fn=>async(...args)=>{try{return await fn(...args)}catch(e){toast(e.message||'Something went wrong')}};
function authRender(){ $('#auth').classList.toggle('hidden',!!token);$('#app').classList.toggle('hidden',!token);if(token)boot() }
function setAuthMode(reg){registerMode=reg;$('#nameWrap').classList.toggle('hidden',!reg);$('#name').required=reg;$('#authTitle').textContent=reg?'Create your workspace account':'Welcome back';$('#authSub').textContent=reg?'Start organizing your team’s work.':'Sign in to continue to your workspace.';$('#authSubmit').textContent=reg?'Create account →':'Sign in →';$('#authSwitchText').textContent=reg?'Already have an account?':'New to Spades PM?';$('#authSwitch').textContent=reg?'Sign in':'Create an account'}
$('#authSwitch').onclick=()=>setAuthMode(!registerMode);$('#authForm').onsubmit=safe(async e=>{e.preventDefault();const b={email:$('#email').value.trim(),password:$('#password').value};if(registerMode)b.name=$('#name').value.trim();const d=await api('POST',registerMode?'register':'login',b);token=d.token;user=d.user;localStorage.setItem('spadesToken',token);localStorage.setItem('spadesUser',JSON.stringify(user));await boot()});
function logout(showToast=true){token=null;user=null;localStorage.removeItem('spadesToken');localStorage.removeItem('spadesUser');$('#auth').classList.remove('hidden');$('#app').classList.add('hidden');if(showToast)toast('Signed out')};$('#signout').onclick=()=>logout();
async function boot(){if(!token)return;try{user=JSON.parse(localStorage.getItem('spadesUser')||'null');if(!user){logout(false);return}applyTheme();$('#userName').textContent=user.name;$('#userRole').textContent=(user.role||'member')==='admin'?'Administrator':'Team member';$('#userAvatar').textContent=initial(user.name);$('#topAvatar').textContent=initial(user.name);$('#adminNav').classList.toggle('hidden',user.role!=='admin');await refreshData();authRenderNoBoot();render()}catch(e){toast(e.message)}}
function authRenderNoBoot(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden')}
async function refreshData(){users=await api('GET','users');projects=await api('GET','projects');allTasks=[];for(const p of projects){try{const ts=await api('GET','projects/'+p.id+'/tasks');allTasks.push(...ts)}catch(e){}}if(!activeProject||!projects.some(p=>p.id===activeProject))activeProject=projects[0]?.id||null}
function applyTheme(){document.body.classList.toggle('theme-dark',dark);localStorage.setItem('spadesTheme',dark?'dark':'light')}function toggleTheme(){dark=!dark;applyTheme();render()};$('#themeToggle').onclick=toggleTheme;$('#themeTop').onclick=toggleTheme;
$('#mainNav').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;if(b.dataset.view==='admin'&&user.role!=='admin'){toast('Administrator access required');return}view=b.dataset.view;$$('#mainNav button').forEach(x=>x.classList.toggle('active',x===b));render()};
$('#globalSearch').oninput=e=>{query=e.target.value.toLowerCase();if(query) {view='search';$$('#mainNav button').forEach(x=>x.classList.remove('active'))}else if(view==='search')view='overview';render()};$('#quickAdd').onclick=()=>openTaskModal();$('#notifBtn').onclick=()=>toast('You’re all caught up. Notifications are ready for a future integration.');$('#topAvatar').onclick=openProfileModal;$('#userAvatar').onclick=openProfileModal;$('#profileNameBtn').onclick=openProfileModal;$('#userName').style.cursor='pointer';$('#userName').title='Open profile';$('#userName').onclick=openProfileModal;
function pageHead(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="pageactions">${actions}</div></div>`}
function stat(label,num,icon,foot){const routes={'Active projects':'view-projects','Projects':'view-projects','Open tasks':'view-open-tasks','Tasks in system':'view-open-tasks','Completed tasks':'view-completed-tasks','Overdue tasks':'view-overdue-tasks','Total members':'view-team','Completion rate':'view-reports','High priority open':'view-open-tasks','Avg. project progress':'view-projects'};const actionName=routes[label]||'view-projects';return `<div class="card statcard" role="button" tabindex="0" aria-label="Open ${label}" data-action="${actionName}"><div class="stathead">${label}<span class="staticon">${icon}</span></div><div class="statnum">${num}</div><div class="statfoot">${foot}</div></div>`}
function projectProgress(p){const ts=allTasks.filter(t=>t.project===p.id);return ts.length?Math.round(ts.filter(t=>t.status==='done').length/ts.length*100):0}function projectCard(p){const ts=allTasks.filter(t=>t.project===p.id),pct=projectProgress(p);return `<article class="card projectcard" data-project="${p.id}"><div class="projecttop"><div class="projecticon">${esc(initial(p.name).slice(0,1))}</div><div style="min-width:0"><strong>${esc(p.name)}</strong><div class="small muted">${ts.length} tasks · Created ${fmtDate((p.created||'').slice(0,10))}</div></div><span style="margin-left:auto;color:#9aa3b4">•••</span></div><div class="projectdesc">${esc(p.description||'No description added yet.')}</div><div class="progressrow"><span>Project progress</span><strong>${pct}%</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div class="projectfoot"><span class="pill ${ts.some(isLate)?'red':'green'}">${ts.filter(isLate).length?ts.filter(isLate).length+' overdue':'On track'}</span><span class="small muted">${ts.filter(t=>t.status==='done').length}/${ts.length} complete</span></div></article>`}
function taskCard(t){const p=projects.find(x=>x.id===t.project),assignee=users.find(x=>x.id===t.assignee);return `<article class="taskcard" data-task="${t.id}" draggable="true"><strong>${esc(t.title)}</strong>${t.description?`<p>${esc(t.description.slice(0,105))}${t.description.length>105?'…':''}</p>`:''}<div class="taskmeta"><span class="priority ${esc(t.priority)}">● ${esc(t.priority)}</span><span class="taskdue ${isLate(t)?'late':''}">${t.due?fmtDate(t.due):''}</span></div><div class="taskmeta" style="margin-top:11px"><span class="small muted">${esc(p?.name||'Project')}</span><span class="avatar" style="width:25px;height:25px;font-size:10px" title="${esc(assignee?.name||'Unassigned')}">${esc(initial(assignee?.name||'—'))}</span></div></article>`}
function empty(title,desc,btn=''){return `<div class="card empty"><div class="emptyicon">✧</div><strong>${title}</strong><p>${desc}</p>${btn}</div>`}

let heroFrame=0,heroPointer={x:0,y:0},heroDrag=null;
function startHeroScene(){
 if(heroFrame)cancelAnimationFrame(heroFrame);const canvas=$('#hero3dCanvas'),stage=$('#heroStage');if(!canvas||!stage)return;
 const ctx=canvas.getContext('2d');if(!ctx)return;let w=0,h=0,spin=0;const points=[];const n=210;
 for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,rad=Math.sqrt(Math.max(0,1-y*y)),theta=Math.PI*(3-Math.sqrt(5))*i;points.push({x:Math.cos(theta)*rad,y,z:Math.sin(theta)*rad,r:Math.random()*1.3+.45})}
 const resize=()=>{const r=stage.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)};resize();
 const project=(p,a,b,scale)=>{let x=p.x*Math.cos(a)-p.z*Math.sin(a),z=p.x*Math.sin(a)+p.z*Math.cos(a),y=p.y*Math.cos(b)-z*Math.sin(b);z=p.y*Math.sin(b)+z*Math.cos(b);const k=scale/(3.2-z);return {x:w*.52+x*k,y:h*.48+y*k,z,k}};
 const draw=()=>{if(!document.body.contains(canvas)){heroFrame=0;return}const d=Math.min(window.devicePixelRatio||1,2);if(canvas.width!==Math.round(stage.clientWidth*d)||canvas.height!==Math.round(stage.clientHeight*d))resize();ctx.clearRect(0,0,w,h);const a=spin*.22+heroPointer.x*.75,b=.24+heroPointer.y*.45,scale=Math.min(w,h)*.9;const projected=points.map(p=>({...project(p,a,b,scale),r:p.r})).sort((p,q)=>p.z-q.z);
 // orbital ellipses
 ctx.save();ctx.translate(w*.52,h*.49);ctx.rotate(-.22+heroPointer.x*.1);ctx.strokeStyle='rgba(128,157,255,.26)';ctx.lineWidth=1;for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(0,0,scale*(.43+j*.085),scale*(.14+j*.018),j*.22,0,Math.PI*2);ctx.stroke()}ctx.restore();
 // connections for nearby projected points
 ctx.lineWidth=.65;for(let i=0;i<projected.length;i+=2){const p=projected[i];for(let j=i+1;j<Math.min(i+6,projected.length);j++){const q=projected[j],dx=p.x-q.x,dy=p.y-q.y;if(dx*dx+dy*dy<2100){ctx.strokeStyle=`rgba(116,158,255,${Math.max(.035,.17-(dx*dx+dy*dy)/15000)})`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}}
 for(const p of projected){const alpha=Math.max(.18,Math.min(.95,(p.z+1.5)/3));ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.6,p.r*(.8+p.k*.18)),0,Math.PI*2);ctx.fillStyle=`rgba(${p.z>.1?'119,224,255':'151,167,255'},${alpha})`;ctx.fill()}
 // glowing core and orbiting satellites
 const cx=w*.52,cy=h*.49,rr=scale*.18;const glow=ctx.createRadialGradient(cx,cy,rr*.08,cx,cy,rr*1.8);glow.addColorStop(0,'rgba(118,139,255,.30)');glow.addColorStop(1,'rgba(82,105,255,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,rr*1.8,0,Math.PI*2);ctx.fill();
 const core=ctx.createRadialGradient(cx-rr*.35,cy-rr*.4,rr*.08,cx,cy,rr);core.addColorStop(0,'#c9f5ff');core.addColorStop(.28,'#7c9aff');core.addColorStop(.7,'#4858ca');core.addColorStop(1,'#17245a');ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(207,224,255,.72)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,rr*1.05,0,Math.PI*2);ctx.stroke();
 for(let j=0;j<3;j++){const ang=spin*(.6+j*.17)+j*2.1,ox=Math.cos(ang)*scale*(.34+j*.045),oy=Math.sin(ang*1.2)*scale*(.12+j*.02);ctx.fillStyle=['#5ff0be','#ffd78a','#b8a8ff'][j];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(cx+ox,cy+oy,3.5+j*.4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 spin+=.008;heroFrame=requestAnimationFrame(draw)};
 stage.onpointerdown=e=>{heroDrag={x:e.clientX,y:e.clientY,px:heroPointer.x,py:heroPointer.y};stage.setPointerCapture?.(e.pointerId)};stage.onpointermove=e=>{if(heroDrag){heroPointer.x=Math.max(-1,Math.min(1,heroDrag.px+(e.clientX-heroDrag.x)/160));heroPointer.y=Math.max(-1,Math.min(1,heroDrag.py+(e.clientY-heroDrag.y)/160))}else{const r=stage.getBoundingClientRect();heroPointer.x=(e.clientX-r.left)/r.width-.5;heroPointer.y=(e.clientY-r.top)/r.height-.5}};stage.onpointerup=stage.onpointercancel=()=>{heroDrag=null};window.addEventListener('resize',resize,{passive:true});draw();
}

function render(){if(!token)return;$('#adminNav').classList.toggle('hidden',user?.role!=='admin');if(view==='admin'&&user?.role!=='admin')view='overview';const root=$('#content');if(view==='overview')root.innerHTML=renderOverview();else if(view==='projects')root.innerHTML=renderProjects();else if(['board','mytasks','calendar'].includes(view))root.innerHTML=renderTasks();else if(view==='reports')root.innerHTML=renderReports();else if(view==='team')root.innerHTML=renderTeam();else if(view==='admin')root.innerHTML=renderAdmin();else if(view==='ai')root.innerHTML=renderAI();else if(view==='search')root.innerHTML=renderSearch();wireContent();if(view==='overview')startHeroScene();else if(heroFrame){cancelAnimationFrame(heroFrame);heroFrame=0}}
function renderOverview(){const done=allTasks.filter(t=>t.status==='done').length,overdue=allTasks.filter(isLate).length,open=allTasks.filter(t=>t.status!=='done').length,owned=allTasks.filter(t=>t.assignee===user?.id&&t.status!=='done').length;const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return d});const vals=days.map(d=>allTasks.filter(t=>t.created&&new Date(t.created).toDateString()===d.toDateString()).length),max=Math.max(1,...vals);return `${pageHead(`Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc(user?.name?.split(' ')[0]||'there')} 👋`,'Here’s what’s happening across your workspace.',`<button class="btn" data-action="new-project">＋ New project</button><button class="btn primary" data-action="new-task">＋ Create task</button>`)}<section class="hero3d"><div class="hero-copy"><span class="hero-eyebrow"><i class="live-dot"></i> Live workspace intelligence</span><h2>Turn complex work into clear momentum.</h2><p>Your projects, tasks, and team activity in one command center. The metrics below are calculated from your saved workspace records.</p><div class="hero-metrics"><div class="hero-metric"><strong>${projects.length}</strong><span>Projects</span></div><div class="hero-metric"><strong>${allTasks.length}</strong><span>Tracked tasks</span></div><div class="hero-metric"><strong>${allTasks.length?Math.round(done/allTasks.length*100):0}%</strong><span>Completion</span></div></div></div><div class="hero-stage" id="heroStage"><canvas id="hero3dCanvas" aria-label="Interactive animated 3D workspace visualization"></canvas><div class="hero-stage-badge"><i class="live-dot"></i> DATA CONNECTED</div><div class="hero-stage-label">Drag to rotate · 3D workspace map</div></div></section><section class="grid stats">${stat('Active projects',projects.length,'▣','Across your workspace')}${stat('Open tasks',open,'☑',`${owned} assigned to you`)}${stat('Completed tasks',done,'✓',allTasks.length?Math.round(done/allTasks.length*100)+'% of all tasks':'No tasks yet')}${stat('Overdue tasks',overdue,'◷',overdue?'Needs attention':'Everything looks clear')}</section><section class="grid dashboardgrid"><div class="card"><div class="cardhead"><div><h3>Workspace activity</h3><div class="small muted">Tasks created per day · last 7 days</div></div><span class="pill">All projects</span></div><div class="chart">${vals.map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v/max*78}%" title="${v} tasks"></div><span class="barlabel">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][days[i].getDay()]}</span></div>`).join('')}</div><p class="small muted" style="margin:13px 0 0">Calculated from task creation timestamps currently stored in this workspace. A zero means no task was created on that day.</p></div><div class="card"><div class="cardhead"><h3>Quick overview</h3><span class="pill green">Live data</span></div><div class="activity"><div class="activityitem"><div class="activitydot">▣</div><div><strong>${projects.length} projects in your workspace</strong><p>Open Projects to review progress and task counts.</p></div></div><div class="activityitem"><div class="activitydot">☑</div><div><strong>${open} tasks still in progress</strong><p>${overdue?overdue+' overdue tasks need attention.':'No overdue tasks detected.'}</p></div></div><div class="activityitem"><div class="activitydot">♙</div><div><strong>${users.length} workspace members</strong><p>Coordinate assignments and share project ownership.</p></div></div><div class="activityitem"><div class="activitydot">✧</div><div><strong>AI project assistant</strong><p>Get planning suggestions based on the data available.</p></div></div></div></div></section><div class="card" style="margin-top:16px"><div class="cardhead"><div><h3>Projects</h3><div class="small muted">A quick look at your active work</div></div><button class="btn" data-action="view-projects">View all →</button></div>${projects.length?`<div class="grid projectgrid">${projects.slice(0,3).map(projectCard).join('')}</div>`:empty('Your workspace starts here','Create a project to organize your team’s tasks.','<button class="btn primary" data-action="new-project">Create your first project</button>')}</div>`}
function renderProjects(){return `${pageHead('Projects','Plan initiatives, track progress, and keep work moving.',`<button class="btn primary" data-action="new-project">＋ New project</button>`)}<div class="toolbar"><input class="field searchfield" id="projectFilter" placeholder="Search projects…" value="${esc(query)}"><span class="pill">${projects.length} total</span></div><div id="projectGrid" class="grid projectgrid">${projects.length?projects.map(projectCard).join(''):empty('No projects yet','Create your first project to start tracking work.','<button class="btn primary" data-action="new-project">＋ New project</button>')}</div>`}
function taskList(tasks){if(!tasks.length)return empty('No tasks found','Try a different filter or create a new task.','<button class="btn primary" data-action="new-task">＋ Create task</button>');return `<div class="card tablewrap"><table class="listtable"><thead><tr><th>Task</th><th>Project</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Due date</th></tr></thead><tbody>${tasks.map(t=>{const p=projects.find(x=>x.id===t.project),u=users.find(x=>x.id===t.assignee);return `<tr data-task="${t.id}" style="cursor:pointer"><td><span class="taskname">${esc(t.title)}</span>${t.description?`<div class="small muted">${esc(t.description.slice(0,65))}</div>`:''}</td><td>${esc(p?.name||'—')}</td><td><span class="pill ${t.status==='done'?'green':isLate(t)?'red':''}">${esc(statuses.find(x=>x[0]===t.status)?.[1]||t.status)}</span></td><td><span class="priority ${esc(t.priority)}">● ${esc(t.priority)}</span></td><td>${esc(u?.name||'Unassigned')}</td><td class="${isLate(t)?'taskdue late':'taskdue'}">${fmtDate(t.due)}</td></tr>`}).join('')}</tbody></table></div>`}
function renderTasks(){let ts=allTasks;if(view==='mytasks')ts=ts.filter(t=>t.assignee===user?.id);if(activeProject){}const filtered=ts.filter(t=>(t.title+' '+t.description).toLowerCase().includes(query));const title=view==='mytasks'?'My tasks':view==='calendar'?'Calendar':'Task board';return `${pageHead(title,view==='mytasks'?'Your assigned work, prioritized in one place.':view==='calendar'?'Review upcoming work and due dates.':'Move work forward and keep every task visible.',`<button class="btn primary" data-action="new-task">＋ Create task</button>`)}<div class="toolbar"><select class="field" id="projectSelect"><option value="">All projects</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><select class="field" id="statusSelect"><option value="">All statuses</option>${statuses.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select><select class="field" id="prioritySelect"><option value="">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select><input class="field searchfield" id="taskFilter" placeholder="Search tasks…" value="${esc(query)}"><div class="tabs"><button data-mode="board" class="${boardMode==='board'?'active':''}">Board</button><button data-mode="list" class="${boardMode==='list'?'active':''}">List</button></div></div><div id="taskResults">${renderTaskResults(filtered)}</div>`}
function renderTaskResults(ts){if(view==='calendar'){const upcoming=ts.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due));return upcoming.length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${upcoming.map(t=>`<div class="card" data-task="${t.id}" style="cursor:pointer"><span class="pill ${isLate(t)?'red':''}">${fmtDate(t.due)}</span><h3 style="margin:13px 0 5px">${esc(t.title)}</h3><div class="small muted">${esc(projects.find(p=>p.id===t.project)?.name||'')}</div><p style="margin:10px 0 0"><span class="priority ${esc(t.priority)}">● ${esc(t.priority)}</span></p></div>`).join('')}</div>`:empty('No dated tasks','Add due dates to tasks to see them here.')}if(boardMode==='list')return taskList(ts);return `<div class="board">${statuses.map(([key,label])=>{const group=ts.filter(t=>t.status===key);return `<section class="column" data-status="${key}"><div class="colhead"><span>${label}<span class="count">${group.length}</span></span><button class="iconbtn" style="width:29px;height:29px" data-action="new-task" data-status="${key}">＋</button></div>${group.map(taskCard).join('')||'<div class="small muted" style="padding:12px 3px">Drop tasks here</div>'}</section>`}).join('')}</div>`}
function renderReports(){const done=allTasks.filter(t=>t.status==='done').length,late=allTasks.filter(isLate).length,high=allTasks.filter(t=>t.priority==='high'&&t.status!=='done').length;return `${pageHead('Reports & analytics','Understand progress, workload, and project health.',`<button class="btn" data-action="export-csv">↓ Export CSV</button>`)}<section class="grid stats">${stat('Completion rate',allTasks.length?Math.round(done/allTasks.length*100)+'%':'0%','✓','Based on current task statuses')}${stat('Overdue tasks',late,'◷',late?'Review due dates':'No overdue tasks')}${stat('High priority open',high,'↑','Open high-priority work')}${stat('Avg. project progress',projects.length?Math.round(projects.reduce((n,p)=>n+projectProgress(p),0)/projects.length)+'%':'0%','▣','Across all projects')}</section><section class="grid dashboardgrid"><div class="card"><div class="cardhead"><h3>Tasks by status</h3><span class="pill">Live snapshot</span></div>${statuses.map(([s,l])=>{const n=allTasks.filter(t=>t.status===s).length,pct=allTasks.length?n/allTasks.length*100:0;return `<div style="margin:16px 0"><div class="progressrow"><span>${l}</span><strong>${n}</strong></div><div class="progress"><span style="width:${pct}%"></span></div></div>`}).join('')}</div><div class="card"><div class="cardhead"><h3>Priority distribution</h3></div>${['high','medium','low'].map((s,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)"><span class="priority ${s}">● ${s[0].toUpperCase()+s.slice(1)}</span><strong>${allTasks.filter(t=>t.priority===s&&t.status!=='done').length}</strong></div>`).join('')}<p class="small muted" style="margin:15px 0 0">These are operational metrics from the current project and task records.</p></div></section>`}
function renderTeam(){return `${pageHead('Team','Manage workspace members, roles, and access.',user.role==='admin'?'<button class="btn primary" data-action="add-member">＋ Add member</button><button class="btn" data-action="go-admin">Admin panel →</button>':'')}<div class="card tablewrap"><table class="listtable"><thead><tr><th>Member</th><th>Email</th><th>Role</th><th>Joined</th>${user.role==='admin'?'<th>Actions</th>':''}</tr></thead><tbody>${users.map(u=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avatar">${esc(initial(u.name))}</span><span class="taskname">${esc(u.name)}${u.id===user.id?' (you)':''}</span></div></td><td>${esc(u.email)}</td><td><span class="pill ${u.role==='admin'?'':'green'}">${u.role==='admin'?'Administrator':'Member'}</span></td><td>${u.created?fmtDate(u.created.slice(0,10)):'—'}</td>${user.role==='admin'?`<td>${u.id===user.id?'<span class="muted small">Your account</span>':`<button class="btn danger" data-remove-user="${u.id}">Remove</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Member removal revokes sessions and unassigns their tasks; it does not delete projects or task history.</p>`}
function renderAdmin(){const a=users.length,open=allTasks.filter(t=>t.status!=='done').length;return `${pageHead('Admin panel','Workspace administration, access control, and oversight.')}<div class="adminhead"><span class="pill">♙ ADMINISTRATOR WORKSPACE</span><h2 style="font-size:25px;margin:17px 0 4px">Manage your workspace with confidence.</h2><p>Control access, review usage, and keep your team organized.</p></div><section class="grid stats">${stat('Total members',a,'♙','Registered workspace accounts')}${stat('Projects',projects.length,'▣','All workspace projects')}${stat('Tasks in system',allTasks.length,'☑','Across all projects')}${stat('Open tasks',open,'◷','Not marked complete')}</section><div class="card" style="margin-bottom:16px"><div class="cardhead"><div><h3>Member management</h3><div class="small muted">Change roles for members. Only administrators can access this section.</div></div><span class="pill green">Role-based access</span></div><div class="toolbar admin-toolbar"><input class="field searchfield" id="memberFilter" placeholder="Search name or email…"><button class="btn primary" data-action="add-member">＋ Add member</button><button class="btn" data-action="export-csv">Export tasks CSV</button></div><div class="tablewrap"><table class="listtable"><thead><tr><th>Member</th><th>Email</th><th>Role</th><th>Joined</th><th>Access / Actions</th></tr></thead><tbody id="memberRows">${adminRows(users)}</tbody></table></div></div>`}
function adminRows(arr){return arr.map(u=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avatar">${esc(initial(u.name))}</span><span class="taskname">${esc(u.name)}${u.id===user.id?' (you)':''}</span></div></td><td>${esc(u.email)}</td><td><span class="pill ${u.role==='admin'?'':'green'}">${u.role==='admin'?'Administrator':'Member'}</span></td><td>${u.created?fmtDate(u.created.slice(0,10)):'—'}</td><td><div class="member-actions"><select class="role-select" data-role-user="${u.id}" ${u.id===user.id?'disabled title="You cannot change your own role"':''}><option value="member" ${u.role!=='admin'?'selected':''}>Member</option><option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option></select>${u.id===user.id?'<span class="muted small">Current account</span>':`<button class="btn danger" data-remove-user="${u.id}">Remove</button>`}</div></td></tr>`).join('')}
function renderAI(){return `${pageHead('AI project assistant','Planning support grounded in your current workspace data.')}<div class="grid dashboardgrid"><div class="card"><div class="brandrow"><div class="brandmark">✧</div><div><h2>What are we working on?</h2><div class="small muted">Ask for a project plan, a task breakdown, or a summary.</div></div></div><div class="toolbar" style="margin-top:22px"><button class="btn" data-ai="plan">Create a project plan</button><button class="btn" data-ai="risks">Review project risks</button><button class="btn" data-ai="summary">Summarize workspace</button></div><label for="aiPrompt">Your request</label><textarea id="aiPrompt" class="field" rows="4" placeholder="Example: Help me plan a 4-week website launch with design, development, testing, and release tasks."></textarea><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" data-action="ask-ai">Generate suggestions →</button></div><div id="aiAnswer" style="margin-top:18px"></div></div><div class="card"><h3>AI workspace context</h3><div class="activity"><div class="activityitem"><div class="activitydot">▣</div><div><strong>${projects.length} projects</strong><p>Available as planning context.</p></div></div><div class="activityitem"><div class="activitydot">☑</div><div><strong>${allTasks.length} tasks</strong><p>Current statuses, priorities, assignees, and due dates.</p></div></div></div><div class="mutedline"></div></div></div>`}
function renderSearch(){const ps=projects.filter(p=>(p.name+' '+p.description).toLowerCase().includes(query)),ts=allTasks.filter(t=>(t.title+' '+t.description).toLowerCase().includes(query));return `${pageHead('Search results',`Results for “${esc(query)}”`)}<h3>Projects (${ps.length})</h3><div class="grid projectgrid">${ps.map(projectCard).join('')||'<p class="muted small">No matching projects.</p>'}</div><h3 style="margin-top:24px">Tasks (${ts.length})</h3>${taskList(ts)}`}
function wireContent(){ wireRemoveUsers(); $$('[data-action]').forEach(b=>{b.onclick=()=>action(b.dataset.action,b.dataset.status);if(b.classList.contains('statcard'))b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(b.dataset.action,b.dataset.status)}}});$$('[data-project]').forEach(e=>e.onclick=()=>{activeProject=e.dataset.project;view='board';boardMode='board';query='';$('#globalSearch').value='';render();$('#projectSelect')&&($('#projectSelect').value=activeProject)});$$('[data-task]').forEach(e=>{e.onclick=()=>openTaskModal(allTasks.find(t=>t.id===e.dataset.task));if(e.draggable){e.ondragstart=ev=>ev.dataTransfer.setData('taskId',e.dataset.task)}});$$('[data-status]').forEach(c=>{if(!c.classList.contains('column'))return;c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=safe(async e=>{e.preventDefault();c.classList.remove('over');const t=allTasks.find(x=>x.id===e.dataTransfer.getData('taskId'));if(t&&t.status!==c.dataset.status){await api('PUT','tasks/'+t.id,{status:c.dataset.status});await refreshData();render();toast('Task status updated')}})});$$('[data-mode]').forEach(b=>b.onclick=()=>{boardMode=b.dataset.mode;render()});$('#projectFilter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#projectGrid').innerHTML=projects.filter(p=>(p.name+' '+p.description).toLowerCase().includes(q)).map(projectCard).join('')||empty('No matching projects','Try another search.') ;wireProjectCards()});$('#taskFilter')?.addEventListener('input',e=>{query=e.target.value.toLowerCase();filterTaskResults()});$('#projectSelect')?.addEventListener('change',e=>{activeProject=e.target.value||null;filterTaskResults()});$('#statusSelect')?.addEventListener('change',filterTaskResults);$('#prioritySelect')?.addEventListener('change',filterTaskResults);$('#memberFilter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#memberRows').innerHTML=adminRows(users.filter(u=>(u.name+' '+u.email).toLowerCase().includes(q)));wireRoles()});wireRoles();$$('.stats .card').forEach((c,i)=>{c.classList.add('statclick');c.title=['View team members','View projects','View task board','View open tasks'][i]||'View details';c.onclick=()=>{if(i===0)view='team';else if(i===1)view='projects';else view='board';render()}});$$('[data-ai]').forEach(b=>b.onclick=()=>{const prompts={plan:'Create a practical project plan with phases, milestones, and tasks.',risks:'Review overdue tasks, high-priority open tasks, and project completion to identify potential risks.',summary:'Summarize the current workspace projects and task status.'};$('#aiPrompt').value=prompts[b.dataset.ai]});}
function wireProjectCards(){ $$('[data-project]').forEach(e=>e.onclick=()=>{activeProject=e.dataset.project;view='board';render()}) }
function filterTaskResults(){const q=($('#taskFilter')?.value||'').toLowerCase(),p=$('#projectSelect')?.value||'',s=$('#statusSelect')?.value||'',pr=$('#prioritySelect')?.value||'';let ts=allTasks;if(view==='mytasks')ts=ts.filter(t=>t.assignee===user?.id);if(p)ts=ts.filter(t=>t.project===p);if(s)ts=ts.filter(t=>t.status===s);if(pr)ts=ts.filter(t=>t.priority===pr);ts=ts.filter(t=>(t.title+' '+t.description).toLowerCase().includes(q));$('#taskResults').innerHTML=renderTaskResults(ts);wireContent()}
function openProfileModal(){if(!user)return;openModal(`<div class="modalhead"><div><h2>My profile</h2><p class="muted small">Your Spades PM account details.</p></div><button class="iconbtn" data-close aria-label="Close profile">×</button></div><div class="activity"><div class="activityitem"><div class="avatar">${esc(initial(user.name))}</div><div><strong>${esc(user.name||'User')}</strong><p>${esc(user.email||'')}</p></div></div><div class="activityitem"><div class="activitydot">♙</div><div><strong>Role</strong><p>${(user.role||'member')==='admin'?'Administrator':'Team member'}</p></div></div></div><div class="modalfoot"><button class="btn" type="button" data-close>Close</button><button class="btn danger" type="button" id="profileSignOut">Sign out</button></div>`);$('#profileSignOut')?.addEventListener('click',()=>logout())}
function action(a,status){if(a==='view-team'){view='team';render();return}if(a==='view-reports'){view='reports';render();return}if(['view-open-tasks','view-completed-tasks','view-overdue-tasks'].includes(a)){view='board';boardMode='board';render();if(a==='view-completed-tasks')toast('Task board opened — select Done to review completed tasks.');else if(a==='view-overdue-tasks')toast('Task board opened — overdue tasks are marked in red.');return}if(a==='add-member')return openMemberModal();if(a==='new-project')return openProjectModal();if(a==='new-task')return openTaskModal(null,status);if(a==='view-projects'){view='projects';render()}if(a==='go-admin'){view='admin';render()}if(a==='export-csv')return exportCSV();if(a==='ask-ai')return answerAI()}
function openModal(html){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><section class="modal">${html}</section></div>`;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};$('#modalBack').querySelector('[data-close]')?.addEventListener('click',closeModal)}function closeModal(){$('#modalRoot').innerHTML=''}
function openProjectModal(){openModal(`<div class="modalhead"><div><h2>New project</h2><p class="muted small">Create a shared space for a goal or initiative.</p></div><button class="iconbtn" data-close>×</button></div><form id="projectForm"><label for="pName">Project name</label><input class="field" id="pName" maxlength="80" required placeholder="e.g. Website redesign"><label for="pDesc">Description</label><textarea class="field" id="pDesc" rows="3" maxlength="500" placeholder="What does success look like?"></textarea><div class="modalfoot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary">Create project</button></div></form>`);$('#projectForm').onsubmit=safe(async e=>{e.preventDefault();const p=await api('POST','projects',{name:$('#pName').value,description:$('#pDesc').value});closeModal();await refreshData();activeProject=p.id;view='board';render();toast('Project created')})}
function openTaskModal(t=null,defaultStatus='todo'){const fresh=!t;t=t||{title:'',description:'',status:defaultStatus,priority:'medium',assignee:'',due:'',project:activeProject||projects[0]?.id,comments:[]};openModal(`<div class="modalhead"><div><h2>${fresh?'Create task':'Task details'}</h2><p class="muted small">Keep ownership, priority, and next steps clear.</p></div><button class="iconbtn" data-close>×</button></div><form id="taskForm"><div class="formgrid"><div class="full"><label for="tTitle">Task title</label><input class="field" id="tTitle" maxlength="140" required value="${esc(t.title)}" placeholder="What needs to get done?"></div><div class="full"><label for="tDesc">Description</label><textarea class="field" id="tDesc" rows="3" maxlength="2000" placeholder="Add context, acceptance criteria, or notes">${esc(t.description)}</textarea></div><div><label for="tProject">Project</label><select class="field" id="tProject" required>${projects.map(p=>`<option value="${p.id}" ${t.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label for="tStatus">Status</label><select class="field" id="tStatus">${statuses.map(([s,l])=>`<option value="${s}" ${t.status===s?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="tPriority">Priority</label><select class="field" id="tPriority">${['low','medium','high'].map(s=>`<option value="${s}" ${t.priority===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><div><label for="tAssignee">Assignee</label><select class="field" id="tAssignee"><option value="">Unassigned</option>${users.map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div><label for="tDue">Due date</label><input class="field" id="tDue" type="date" value="${esc(t.due)}"></div></div>${!fresh?`<div class="mutedline"></div><h3>Comments (${(t.comments||[]).length})</h3><div style="max-height:120px;overflow:auto">${(t.comments||[]).map(c=>`<p class="small"><strong>${esc(c.user)}</strong> <span class="muted">${c.at?new Date(c.at).toLocaleString():''}</span><br>${esc(c.text)}</p>`).join('')||'<p class="small muted">No comments yet.</p>'}</div><div style="display:flex;gap:8px"><input class="field" id="tComment" placeholder="Add a comment…"><button class="btn" type="button" id="postComment">Post</button></div>`:''}<div class="modalfoot">${!fresh?'<button class="btn danger" type="button" id="deleteTask" style="margin-right:auto">Delete</button>':''}<button class="btn" type="button" data-close>Cancel</button><button class="btn primary">${fresh?'Create task':'Save changes'}</button></div></form>`);$('#taskForm').onsubmit=safe(async e=>{e.preventDefault();const b={title:$('#tTitle').value,description:$('#tDesc').value,project:$('#tProject').value,status:$('#tStatus').value,priority:$('#tPriority').value,assignee:$('#tAssignee').value,due:$('#tDue').value};if(fresh)await api('POST','projects/'+b.project+'/tasks',b);else await api('PUT','tasks/'+t.id,b);closeModal();await refreshData();render();toast(fresh?'Task created':'Task updated')});if(!fresh){$('#deleteTask').onclick=safe(async()=>{if(!confirm('Delete this task?'))return;await api('DELETE','tasks/'+t.id);closeModal();await refreshData();render();toast('Task deleted')});$('#postComment').onclick=safe(async()=>{const text=$('#tComment').value.trim();if(!text)return;await api('POST','tasks/'+t.id+'/comments',{text});await refreshData();const latest=allTasks.find(x=>x.id===t.id);openTaskModal(latest);toast('Comment added')})}}
function openMemberModal(){if(user?.role!=='admin'){toast('Administrator access required');return}openModal(`<div class="modalhead"><div><h2>Add workspace member</h2><p class="muted small">Create an account and assign its initial access role.</p></div><button class="iconbtn" data-close>×</button></div><form id="memberForm"><label for="mName">Full name</label><input class="field" id="mName" maxlength="60" required placeholder="Team member name"><label for="mEmail">Work email</label><input class="field" id="mEmail" type="email" maxlength="120" required placeholder="name@company.com"><label for="mPassword">Temporary password</label><input class="field" id="mPassword" type="password" minlength="8" maxlength="200" required autocomplete="new-password" placeholder="At least 8 characters"><label for="mRole">Access role</label><select class="field" id="mRole"><option value="member">Member</option><option value="admin">Administrator</option></select><p class="small muted" style="margin-top:12px">Share the initial password securely. Password reset and email invitations are not included in this version.</p><div class="modalfoot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary">Create member</button></div></form>`);$('#memberForm').onsubmit=safe(async e=>{e.preventDefault();await api('POST','admin/users',{name:$('#mName').value.trim(),email:$('#mEmail').value.trim(),password:$('#mPassword').value,role:$('#mRole').value});closeModal();await refreshData();render();toast('Member account created')})}
function wireRemoveUsers(){ $$('[data-remove-user]').forEach(b=>b.onclick=safe(async()=>{const target=users.find(u=>u.id===b.dataset.removeUser);if(!target)return;if(!confirm(`Remove ${target.name} (${target.email}) from this workspace? Their sessions will be revoked and their tasks unassigned. This cannot be undone.`))return;await api('DELETE',`admin/users/${target.id}`);await refreshData();render();toast('Member removed')})) }
function wireRoles(){wireRemoveUsers();$$('[data-role-user]').forEach(s=>s.onchange=safe(async()=>{const old=users.find(u=>u.id===s.dataset.roleUser)?.role||'member';if(!confirm(`Change this user's role to ${s.value==='admin'?'Administrator':'Member'}?`)){s.value=old;return}const d=await api('PUT',`admin/users/${s.dataset.roleUser}/role`,{role:s.value});users=users.map(u=>u.id===d.id?d:u);if(d.id===user.id){user=d;localStorage.setItem('spadesUser',JSON.stringify(user))}render();toast('Member role updated')}))}
function exportCSV(){const rows=[['Title','Project','Status','Priority','Assignee','Due date'],...allTasks.map(t=>[t.title,projects.find(p=>p.id===t.project)?.name||'',t.status,t.priority,users.find(u=>u.id===t.assignee)?.name||'',t.due||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='spades-pm-tasks.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV export prepared')}
function answerAI(){const prompt=$('#aiPrompt').value.trim();if(!prompt){toast('Enter a request first');return}const answer=$('#aiAnswer');let lines=[];if(/risk|overdue|deadline/i.test(prompt)){const late=allTasks.filter(isLate),high=allTasks.filter(t=>t.priority==='high'&&t.status!=='done');lines=['Workspace risk review',`${late.length} overdue tasks need review.`,`${high.length} high-priority tasks remain open.`,...late.slice(0,5).map(t=>'• '+t.title+' — overdue since '+fmtDate(t.due)),...high.slice(0,5).map(t=>'• High priority: '+t.title)];}else if(/summary|summari/i.test(prompt)){lines=['Workspace summary',`${projects.length} projects and ${allTasks.length} tasks are currently recorded.`,`${allTasks.filter(t=>t.status==='done').length} tasks are completed; ${allTasks.filter(isLate).length} are overdue.`,...projects.map(p=>`• ${p.name}: ${projectProgress(p)}% complete`)]}else{lines=['Suggested project plan','1. Define scope, goals, and acceptance criteria.','2. Break the work into milestones and deliverables.','3. Create tasks with an owner, priority, and due date.','4. Review dependencies and risks before work begins.','5. Hold regular progress reviews and adjust the plan.','6. Test the deliverables and document the release.','',`Your request: ${prompt}`,'','These are rule-based starter suggestions, not AI-generated output. Configure a real AI provider on the backend to enable model-generated plans.']}answer.innerHTML=`<div class="card" style="background:var(--surface2)"><h3>Suggestions</h3><div style="white-space:pre-wrap;line-height:1.8">${esc(lines.join('\n'))}</div></div>`}
$('#content').addEventListener('click',e=>{if(e.target.closest('[data-action="ask-ai"]'))answerAI()});
setAuthMode(false);if(dark)applyTheme();authRender();
</script></body></html>
